server:
  port: 8080

spring:
  application:
    name: job-queue-platform-refined

  datasource:
    url: jdbc:postgresql://localhost:5432/jobqueue
    username: jobqueue
    password: jobqueue
    driver-class-name: org.postgresql.Driver
 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
 
logging:
  level:
    org.hibernate.SQL: debug
 
